<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stock Finder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; }
  header { background: #1a1a2e; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 700; flex: 1; }
  .store-dot { width: 10px; height: 10px; border-radius: 50%; background: #facc15; flex-shrink: 0; transition: background .4s; }
  .tab-bar { display: flex; background: #fff; border-bottom: 2px solid #f0f0f0; }
  .tab-bar-btn { flex: 1; padding: 13px; font-size: 14px; font-weight: 700; border: none; background: none; cursor: pointer; color: #999; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all .15s; }
  .tab-bar-btn.active { color: #6366f1; border-bottom-color: #6366f1; }
  .panel { display: none; }
  .panel.active { display: block; }
  .controls { background: #fff; padding: 16px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  label { font-size: 12px; font-weight: 600; color: #888; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .4px; }
  select, input { width: 100%; padding: 11px 14px; border: 1.5px solid #ddd; border-radius: 10px; font-size: 15px; margin-bottom: 12px; appearance: none; background: #fafafa; color: #1a1a2e; }
  select:focus, input:focus { outline: none; border-color: #6366f1; background: #fff; }
  select:disabled { color: #bbb; }
  .brand-wrap { position: relative; }
  .brand-wrap input { margin-bottom: 0; }
  .brand-dropdown { position: absolute; top: 100%; left: 0; right: 0; z-index: 100; background: #fff; border: 1.5px solid #ddd; border-top: none; border-radius: 0 0 10px 10px; max-height: 220px; overflow-y: auto; box-shadow: 0 4px 12px rgba(0,0,0,.1); display: none; }
  .brand-dropdown.open { display: block; }
  .brand-option { padding: 10px 14px; font-size: 14px; cursor: pointer; color: #333; }
  .brand-option:hover, .brand-option.highlighted { background: #eef2ff; color: #6366f1; }
  .brand-clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: #e0e0e0; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; display: none; align-items: center; justify-content: center; color: #555; }
  .brand-clear.visible { display: flex; }
  .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .search-row input { margin-bottom: 0; flex: 1; }
  .scan-btn { flex-shrink: 0; width: 48px; height: 48px; border-radius: 10px; background: #1a1a2e; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .scan-btn:active { background: #2d2d4e; }
  button.search-btn, button.browse-btn { width: 100%; padding: 13px; background: #6366f1; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background .15s; }
  button.search-btn:disabled, button.browse-btn:disabled { background: #a5a7f5; cursor: not-allowed; }
  .size-chips-wrap { margin-bottom: 12px; }
  .size-chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 32px; }
  .size-chip { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; border: 1.5px solid #ddd; background: #fafafa; cursor: pointer; color: #555; transition: all .15s; white-space: nowrap; user-select: none; }
  .size-chip.selected { background: #6366f1; color: #fff; border-color: #6366f1; }
  .size-chips-empty { font-size: 12px; color: #bbb; padding: 6px 0; }
  .loading-banner { background: #fefce8; border: 1px solid #fde047; color: #854d0e; padding: 12px 20px; font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .loading-banner.hidden { display: none; }
  .mini-spin { width: 16px; height: 16px; border: 2px solid #fde047; border-top-color: #854d0e; border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
  .status-bar { padding: 8px 20px; font-size: 12px; color: #888; background: #fff; border-top: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
  .refresh-btn { font-size: 12px; color: #6366f1; cursor: pointer; background: none; border: none; padding: 4px 8px; border-radius: 6px; font-weight: 600; }
  .results { padding: 16px 16px 32px; }
  .section-label { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .5px; margin: 12px 0 8px; }
  .card { background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
  .card.stockout { opacity: .55; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .item-name { font-size: 15px; font-weight: 700; color: #1a1a2e; flex: 1; line-height: 1.3; }
  .store-tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; background: #eef2ff; color: #6366f1; white-space: nowrap; }
  .card-meta { font-size: 12px; color: #888; margin-bottom: 10px; line-height: 1.8; }
  .card-meta span { margin-right: 10px; }
  .stock-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .badge { display: inline-flex; align-items: center; padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; }
  .badge.green { background: #dcfce7; color: #16a34a; }
  .badge.red   { background: #fee2e2; color: #dc2626; }
  .style-btn { margin-left: auto; font-size: 12px; color: #6366f1; font-weight: 600; background: #eef2ff; border: none; padding: 5px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .brand-card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.07); display: flex; align-items: center; gap: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .brand-card:active { box-shadow: 0 3px 12px rgba(99,102,241,.2); }
  .brand-logo { width: 44px; height: 44px; border-radius: 10px; background: #eef2ff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: #6366f1; flex-shrink: 0; }
  .brand-info { flex: 1; min-width: 0; }
  .brand-name { font-size: 15px; font-weight: 700; color: #1a1a2e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-sub  { font-size: 12px; color: #888; margin-top: 2px; }
  .brand-count { text-align: right; flex-shrink: 0; }
  .count-pill { background: #6366f1; color: #fff; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 20px; display: inline-block; }
  .count-pill.zero { background: #e5e7eb; color: #9ca3af; }
  .count-sub { font-size: 11px; color: #aaa; margin-top: 3px; text-align: right; }
  .empty { text-align: center; padding: 48px 20px; color: #aaa; font-size: 15px; }
  .spinner { text-align: center; padding: 40px; }
  .spinner::after { content: ''; display: inline-block; width: 28px; height: 28px; border: 3px solid #eee; border-top-color: #6366f1; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { background: #fee2e2; color: #dc2626; padding: 12px 16px; border-radius: 10px; font-size: 14px; line-height: 1.5; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; display: none; align-items: flex-end; }
  .modal-overlay.open { display: flex; }
  .modal { background: #f0f2f5; border-radius: 20px 20px 0 0; width: 100%; max-height: 90vh; display: flex; flex-direction: column; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: #fff; border-radius: 20px 20px 0 0; border-bottom: 1px solid #f0f0f0; }
  .modal-title { font-size: 15px; font-weight: 700; color: #1a1a2e; }
  .modal-close { background: #f0f0f0; border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 16px; cursor: pointer; color: #555; }
  .modal-body { overflow-y: auto; padding: 12px 16px 32px; }
  .modal-loading { text-align: center; padding: 32px; color: #aaa; }
  .scanner-overlay { position: fixed; inset: 0; background: #000; z-index: 300; display: none; flex-direction: column; }
  .scanner-overlay.open { display: flex; }
  .scanner-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: rgba(0,0,0,.6); z-index: 2; }
  .scanner-title { color: #fff; font-size: 16px; font-weight: 700; }
  .scanner-close { background: rgba(255,255,255,.15); border: none; border-radius: 50%; width: 32px; height: 32px; color: #fff; font-size: 18px; cursor: pointer; }
  #scannerVideo { width: 100%; flex: 1; object-fit: cover; display: block; }
  .scanner-reticle { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 240px; height: 160px; z-index: 2; pointer-events: none; }
  .scanner-reticle::before { content:''; position:absolute; top:0; left:0; width:36px; height:36px; border-top:3px solid #6366f1; border-left:3px solid #6366f1; border-radius:4px 0 0 0; }
  .scanner-reticle::after  { content:''; position:absolute; bottom:0; right:0; width:36px; height:36px; border-bottom:3px solid #6366f1; border-right:3px solid #6366f1; border-radius:0 0 4px 0; }
  .reticle-tr { position:absolute; top:0; right:0; width:36px; height:36px; border-top:3px solid #6366f1; border-right:3px solid #6366f1; border-radius:0 4px 0 0; }
  .reticle-bl { position:absolute; bottom:0; left:0; width:36px; height:36px; border-bottom:3px solid #6366f1; border-left:3px solid #6366f1; border-radius:0 0 0 4px; }
  .scan-line { position:absolute; left:8px; right:8px; height:2px; background:linear-gradient(90deg,transparent,#6366f1,transparent); animation:scanline 2s ease-in-out infinite; }
  @keyframes scanline { 0%{top:8px} 50%{top:calc(100% - 8px)} 100%{top:8px} }
  .scanner-hint { position:absolute; bottom:40px; left:0; right:0; text-align:center; color:rgba(255,255,255,.7); font-size:13px; z-index:2; }
  .scanner-result-flash { position:absolute; bottom:80px; left:20px; right:20px; background:#4ade80; color:#166534; padding:12px 16px; border-radius:12px; font-weight:700; font-size:15px; text-align:center; z-index:3; display:none; }
  .scanner-result-flash.show { display:block; }
</style>
</head>
<body>

<header>
  <div class="store-dot" id="dotEl"></div>
  <h1>Stock Finder</h1>
</header>

<div style="background:#fff;padding:12px 20px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)">
  <label>Store</label>
  <select id="storeSelect" onchange="onStoreChange()" style="margin-bottom:12px">
    <option value="hyderabad">Hyderabad</option>
    <option value="delhi">Delhi</option>
    <option value="pune">Pune</option>
  </select>
</div>

<div class="tab-bar">
  <button class="tab-bar-btn active" onclick="switchTab('search',this)">🔍 Search</button>
  <button class="tab-bar-btn"        onclick="switchTab('browse',this)">📂 Browse</button>
</div>

<!-- SEARCH TAB -->
<div id="panel-search" class="panel active">
  <div class="controls">
    <label>Brand <span style="font-weight:400;text-transform:none">(optional)</span></label>
    <div class="brand-wrap" style="margin-bottom:12px">
      <input type="text" id="brandInput" placeholder="Type to filter by brand…"
             autocomplete="off"
             oninput="onBrandInput()"
             onkeydown="onBrandKey(event)"
             onfocus="openBrandDropdown()"
             onclick="openBrandDropdown()"/>
      <button class="brand-clear" id="brandClear" onclick="clearBrand()">✕</button>
      <div class="brand-dropdown" id="brandDropdown"></div>
    </div>
    <label>Search</label>
    <div class="search-row">
      <input type="text" id="queryInput" placeholder="Barcode or product name…"
             autocomplete="off" onkeydown="if(event.key==='Enter'&&cacheReady)doSearch()"/>
      <button class="scan-btn" onclick="openScanner()" title="Scan barcode">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <path d="M2 6V4a2 2 0 0 1 2-2h2"/><path d="M18 2h2a2 2 0 0 1 2 2v2"/>
          <path d="M22 18v2a2 2 0 0 1-2 2h-2"/><path d="M6 22H4a2 2 0 0 1-2-2v-2"/>
          <line x1="7" y1="8" x2="7" y2="16"/><line x1="10" y1="8" x2="10" y2="16"/>
          <line x1="13" y1="8" x2="13" y2="16" stroke-width="1.5"/><line x1="16" y1="8" x2="16" y2="16"/>
        </svg>
      </button>
    </div>
    <button class="search-btn" id="searchBtn" onclick="doSearch()" disabled>Loading data…</button>
  </div>
  <div class="loading-banner" id="loadingBanner">
    <div class="mini-spin"></div>
    <span id="loadingText">Loading inventory data…</span>
  </div>
  <div class="status-bar">
    <span id="statusText">Connecting…</span>
    <button class="refresh-btn" onclick="forceRefresh()">↺ Refresh</button>
  </div>
  <div id="searchResults" class="results">
    <div class="empty">Select a store and search above</div>
  </div>
</div>

<!-- BROWSE TAB -->
<div id="panel-browse" class="panel">
  <div class="controls">
    <div style="font-size:12px;color:#888;margin-bottom:12px">All filters are optional — select at least one to browse.</div>
    <label>Division</label>
    <select id="divSelect" onchange="onDivChange()">
      <option value="">All Divisions</option>
    </select>
    <label>Section</label>
    <select id="secSelect" onchange="onSecChange()" disabled>
      <option value="">All Sections</option>
    </select>
    <label>Department</label>
    <select id="depSelect" onchange="onDepChange()" disabled>
      <option value="">All Departments</option>
    </select>
    <label>Brand <span style="font-weight:400;text-transform:none">(optional)</span></label>
    <div class="brand-wrap" style="margin-bottom:12px">
      <input type="text" id="browseBrandInput" placeholder="Type to filter by brand…"
             autocomplete="off"
             oninput="onBrowseBrandInput()"
             onkeydown="onBrowseBrandKey(event)"
             onfocus="ensureBrowseBrands()"
             onclick="ensureBrowseBrands()"/>
      <button class="brand-clear" id="browseBrandClear" onclick="clearBrowseBrand()">✕</button>
      <div class="brand-dropdown" id="browseBrandDropdown"></div>
    </div>
    <label>Size <span style="font-weight:400;text-transform:none">(tap to multi-select)</span></label>
    <div class="size-chips-wrap">
      <div class="size-chips" id="sizeChips">
        <span class="size-chips-empty">Select filters above to see sizes</span>
      </div>
    </div>
    <button class="browse-btn" id="browseBtn" onclick="doBrowse()" disabled>Loading data…</button>
  </div>
  <div id="browseResults" class="results">
    <div class="empty">Select at least one filter and tap Browse</div>
  </div>
</div>

<!-- BRAND PRODUCTS MODAL -->
<div class="modal-overlay" id="brandModal" onclick="closeBrandModal(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="brandModalTitle">Products</span>
      <button class="modal-close" onclick="closeBrandModal()">✕</button>
    </div>
    <div class="modal-body" id="brandModalBody"><div class="modal-loading">Loading…</div></div>
  </div>
</div>

<!-- STYLE MODAL -->
<div class="modal-overlay" id="styleModal" onclick="closeStyleModal(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="styleModalTitle">Style Group</span>
      <button class="modal-close" onclick="closeStyleModal()">✕</button>
    </div>
    <div class="modal-body" id="styleModalBody"><div class="modal-loading">Loading…</div></div>
  </div>
</div>

<!-- SCANNER -->
<div class="scanner-overlay" id="scannerOverlay">
  <div class="scanner-header">
    <span class="scanner-title">📷 Scan Barcode</span>
    <button class="scanner-close" onclick="closeScanner()">✕</button>
  </div>
  <div style="position:relative;flex:1;overflow:hidden">
    <video id="scannerVideo" playsinline muted></video>
    <div class="scanner-reticle"><span class="reticle-tr"></span><span class="reticle-bl"></span><div class="scan-line"></div></div>
    <div class="scanner-hint">Point camera at barcode</div>
    <div class="scanner-result-flash" id="scanResultFlash"></div>
  </div>
</div>

<script src="/zxing.min.js"></script>
<script>
// ── State ─────────────────────────────────────────────────────────────────────
let cacheReady=false, allBrands=[], selectedBrand='', highlightIdx=-1, statusPollTimer=null;
let scannerReader=null, scannerActive=false;
let browseDiv='', browseSec='', browseDep='', browseBrand='';
let selectedSizes=new Set();
let browseBrandList=[], browseBrandHighlight=-1;

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(tab, btn) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-bar-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  btn.classList.add('active');
  if (tab==='browse' && cacheReady) { loadDivisions(); ensureBrowseBrands(); }
}

// ── Store change ──────────────────────────────────────────────────────────────
function onStoreChange() {
  clearBrand(); clearBrowseBrand(); browseBrandList=[];
  if (cacheReady) { loadBrands(); loadDivisions(); }
  document.getElementById('searchResults').innerHTML='<div class="empty">Select a store and search above</div>';
  document.getElementById('browseResults').innerHTML='<div class="empty">Select at least one filter and tap Browse</div>';
  resetBrowseFilters();
}

// ── Status / cache ────────────────────────────────────────────────────────────
function setReady(counts, lastFetched) {
  cacheReady=true;
  document.getElementById('searchBtn').disabled=false;
  document.getElementById('searchBtn').textContent='Search';
  document.getElementById('loadingBanner').classList.add('hidden');
  document.getElementById('dotEl').style.background='#4ade80';
  const total=(counts.hyderabad||0)+(counts.delhi||0)+(counts.pune||0);
  const t=new Date(lastFetched);
  const fmt=t.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+' '+t.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
  document.getElementById('statusText').textContent=`${total.toLocaleString()} items · ${fmt}`;
  loadBrands(); loadDivisions(); updateBrowseBtn();
}
function setLoading(msg) {
  cacheReady=false;
  document.getElementById('searchBtn').disabled=true; document.getElementById('searchBtn').textContent='Loading data…';
  document.getElementById('loadingBanner').classList.remove('hidden');
  document.getElementById('loadingText').textContent=msg||'Loading…';
  document.getElementById('dotEl').style.background='#facc15';
  document.getElementById('statusText').textContent='Loading…';
  updateBrowseBtn();
}
function setError(msg) {
  cacheReady=false;
  document.getElementById('searchBtn').disabled=true; document.getElementById('searchBtn').textContent='Data unavailable';
  document.getElementById('loadingBanner').classList.add('hidden');
  document.getElementById('dotEl').style.background='#f87171';
  document.getElementById('statusText').textContent=msg||'Load error — click ↺ Refresh';
  updateBrowseBtn();
}
async function checkStatus() {
  try {
    const r=await fetch('/api/status'); if(!r.ok){setError('Server error');return;}
    const d=await r.json();
    if(d.status==='ready'){setReady(d.counts,d.lastFetched);if(statusPollTimer){clearInterval(statusPollTimer);statusPollTimer=null;}}
    else if(d.status==='loading'){setLoading('Loading inventory from Google Sheets…');if(!statusPollTimer)statusPollTimer=setInterval(checkStatus,2500);}
    else{setError('Failed to load — click ↺ Refresh');if(statusPollTimer){clearInterval(statusPollTimer);statusPollTimer=null;}}
  } catch{setError('Cannot reach server');setTimeout(checkStatus,5000);}
}
async function forceRefresh(){
  setLoading('Refreshing…');
  try{await fetch('/api/refresh',{method:'POST'});if(!statusPollTimer)statusPollTimer=setInterval(checkStatus,2500);}
  catch{setError('Refresh failed');}
}

// ── Search brand autocomplete ─────────────────────────────────────────────────
async function loadBrands() {
  const store=document.getElementById('storeSelect').value;
  try{const r=await fetch(`/api/brands?store=${store}`);const d=await r.json();allBrands=d.brands||[];}
  catch{allBrands=[];}
}
function onBrandInput(){selectedBrand='';document.getElementById('brandClear').classList.remove('visible');renderBrandDropdown();}
function openBrandDropdown(){if(!allBrands.length)loadBrands().then(renderBrandDropdown);else renderBrandDropdown();}
function renderBrandDropdown(){
  const q=document.getElementById('brandInput').value.toLowerCase();
  const dd=document.getElementById('brandDropdown');
  const matches=q?allBrands.filter(b=>b.toLowerCase().includes(q)).slice(0,60):allBrands.slice(0,60);
  if(!matches.length){dd.classList.remove('open');return;}
  highlightIdx=-1;
  dd.innerHTML=matches.map(b=>`<div class="brand-option" data-brand="${b.replace(/"/g,'&quot;')}" onmousedown="selectBrand('${b.replace(/'/g,"\\'")}')"> ${b}</div>`).join('');
  dd.classList.add('open');
}
function selectBrand(brand){selectedBrand=brand;document.getElementById('brandInput').value=brand;document.getElementById('brandDropdown').classList.remove('open');document.getElementById('brandClear').classList.add('visible');}
function clearBrand(){selectedBrand='';document.getElementById('brandInput').value='';document.getElementById('brandDropdown').classList.remove('open');document.getElementById('brandClear').classList.remove('visible');}
function onBrandKey(e){
  const dd=document.getElementById('brandDropdown'),opts=dd.querySelectorAll('.brand-option');
  if(!dd.classList.contains('open')||!opts.length)return;
  if(e.key==='ArrowDown'){e.preventDefault();highlightIdx=Math.min(highlightIdx+1,opts.length-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();highlightIdx=Math.max(highlightIdx-1,0);}
  else if(e.key==='Enter'&&highlightIdx>=0){e.preventDefault();selectBrand(opts[highlightIdx].dataset.brand);return;}
  else if(e.key==='Escape'){dd.classList.remove('open');return;}
  else return;
  opts.forEach((o,i)=>o.classList.toggle('highlighted',i===highlightIdx));
  opts[highlightIdx]?.scrollIntoView({block:'nearest'});
}

// ── Browse brand autocomplete ─────────────────────────────────────────────────
async function loadBrowseBrandList(){
  const store=document.getElementById('storeSelect').value;
  try{const r=await fetch(`/api/brands?store=${store}`);const d=await r.json();browseBrandList=d.brands||[];}
  catch{browseBrandList=[];}
}
function ensureBrowseBrands(){
  if(!browseBrandList.length) loadBrowseBrandList().then(()=>renderBrowseBrandDropdown());
  else renderBrowseBrandDropdown();
}
function onBrowseBrandInput(){browseBrand='';document.getElementById('browseBrandClear').classList.remove('visible');renderBrowseBrandDropdown();}
function renderBrowseBrandDropdown(){
  const q=document.getElementById('browseBrandInput').value.toLowerCase();
  const dd=document.getElementById('browseBrandDropdown');
  const list=browseBrandList.length?browseBrandList:allBrands;
  const matches=q?list.filter(b=>b.toLowerCase().includes(q)).slice(0,60):list.slice(0,60);
  if(!matches.length){dd.classList.remove('open');return;}
  browseBrandHighlight=-1;
  dd.innerHTML=matches.map(b=>`<div class="brand-option" data-brand="${b.replace(/"/g,'&quot;')}" onmousedown="selectBrowseBrand('${b.replace(/'/g,"\\'")}')"> ${b}</div>`).join('');
  dd.classList.add('open');
}
function selectBrowseBrand(brand){
  browseBrand=brand;document.getElementById('browseBrandInput').value=brand;
  document.getElementById('browseBrandDropdown').classList.remove('open');
  document.getElementById('browseBrandClear').classList.add('visible');
  loadBrowseSizes(); updateBrowseBtn();
}
function clearBrowseBrand(){
  browseBrand='';document.getElementById('browseBrandInput').value='';
  document.getElementById('browseBrandDropdown').classList.remove('open');
  document.getElementById('browseBrandClear').classList.remove('visible');
  updateBrowseBtn();
}
function onBrowseBrandKey(e){
  const dd=document.getElementById('browseBrandDropdown'),opts=dd.querySelectorAll('.brand-option');
  if(!dd.classList.contains('open')||!opts.length)return;
  if(e.key==='ArrowDown'){e.preventDefault();browseBrandHighlight=Math.min(browseBrandHighlight+1,opts.length-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();browseBrandHighlight=Math.max(browseBrandHighlight-1,0);}
  else if(e.key==='Enter'&&browseBrandHighlight>=0){e.preventDefault();selectBrowseBrand(opts[browseBrandHighlight].dataset.brand);return;}
  else if(e.key==='Escape'){dd.classList.remove('open');return;}
  else return;
  opts.forEach((o,i)=>o.classList.toggle('highlighted',i===browseBrandHighlight));
  opts[browseBrandHighlight]?.scrollIntoView({block:'nearest'});
}

// Close dropdowns on outside click
document.addEventListener('click',e=>{
  if(!e.target.closest('#brandInput')&&!e.target.closest('#brandDropdown'))
    document.getElementById('brandDropdown').classList.remove('open');
  if(!e.target.closest('#browseBrandInput')&&!e.target.closest('#browseBrandDropdown'))
    document.getElementById('browseBrandDropdown').classList.remove('open');
});

// ── Browse taxonomy ───────────────────────────────────────────────────────────
async function loadDivisions(){
  const store=document.getElementById('storeSelect').value;
  try{
    const r=await fetch(`/api/taxonomy?store=${store}`);const d=await r.json();
    const sel=document.getElementById('divSelect');
    sel.innerHTML='<option value="">All Divisions</option>'+(d.divisions||[]).map(v=>`<option value="${v}">${v}</option>`).join('');
  }catch{}
}
async function onDivChange(){
  browseDiv=document.getElementById('divSelect').value; browseSec=''; browseDep='';
  const secSel=document.getElementById('secSelect'),depSel=document.getElementById('depSelect');
  secSel.innerHTML='<option value="">All Sections</option>';
  depSel.innerHTML='<option value="">All Departments</option>'; depSel.disabled=true;
  secSel.disabled=!browseDiv;
  if(browseDiv){
    const store=document.getElementById('storeSelect').value;
    try{const r=await fetch(`/api/taxonomy?store=${store}&div=${encodeURIComponent(browseDiv)}`);const d=await r.json();
      secSel.innerHTML='<option value="">All Sections</option>'+(d.sections||[]).map(v=>`<option value="${v}">${v}</option>`).join('');
    }catch{}
  }
  selectedSizes=new Set(); await loadBrowseSizes(); updateBrowseBtn();
}
async function onSecChange(){
  browseSec=document.getElementById('secSelect').value; browseDep='';
  const depSel=document.getElementById('depSelect');
  depSel.innerHTML='<option value="">All Departments</option>'; depSel.disabled=!browseSec;
  if(browseSec){
    const store=document.getElementById('storeSelect').value;
    try{const r=await fetch(`/api/taxonomy?store=${store}&div=${encodeURIComponent(browseDiv)}&sec=${encodeURIComponent(browseSec)}`);const d=await r.json();
      depSel.innerHTML='<option value="">All Departments</option>'+(d.departments||[]).map(v=>`<option value="${v}">${v}</option>`).join('');
    }catch{}
  }
  selectedSizes=new Set(); await loadBrowseSizes(); updateBrowseBtn();
}
async function onDepChange(){
  browseDep=document.getElementById('depSelect').value;
  selectedSizes=new Set(); await loadBrowseSizes(); updateBrowseBtn();
}

// ── Size chips ────────────────────────────────────────────────────────────────
async function loadBrowseSizes(){
  const store=document.getElementById('storeSelect').value;
  const params=new URLSearchParams({store});
  if(browseDiv)params.set('div',browseDiv);
  if(browseSec)params.set('sec',browseSec);
  if(browseDep)params.set('dep',browseDep);
  if(browseBrand)params.set('brand',browseBrand);
  try{
    const r=await fetch(`/api/sizes-list?${params}`);const d=await r.json();
    renderSizeChips(d.sizes||[]);
  }catch{renderSizeChips([]);}
}
function renderSizeChips(sizes){
  const container=document.getElementById('sizeChips');
  const validSizes=new Set(sizes);
  for(const s of selectedSizes){if(!validSizes.has(s))selectedSizes.delete(s);}
  if(!sizes.length){container.innerHTML='<span class="size-chips-empty">No sizes available for current filters</span>';return;}
  container.innerHTML=sizes.map(s=>`<button class="size-chip${selectedSizes.has(s)?' selected':''}" onclick="toggleSize('${s.replace(/'/g,"\\'")}',this)">${s}</button>`).join('');
}
function toggleSize(size,el){
  if(selectedSizes.has(size)){selectedSizes.delete(size);el.classList.remove('selected');}
  else{selectedSizes.add(size);el.classList.add('selected');}
  updateBrowseBtn();
}

// ── Browse button state ───────────────────────────────────────────────────────
function updateBrowseBtn(){
  const btn=document.getElementById('browseBtn');
  const hasAny=browseDiv||browseSec||browseDep||browseBrand||selectedSizes.size>0;
  btn.disabled=!cacheReady||!hasAny;
  if(!cacheReady)btn.textContent='Loading data…';
  else if(!hasAny)btn.textContent='Select at least one filter';
  else btn.textContent='Browse Brands';
}

function resetBrowseFilters(){
  browseDiv='';browseSec='';browseDep='';browseBrand='';selectedSizes=new Set();
  clearBrowseBrand();
  document.getElementById('divSelect').innerHTML='<option value="">All Divisions</option>';
  document.getElementById('secSelect').innerHTML='<option value="">All Sections</option>';
  document.getElementById('depSelect').innerHTML='<option value="">All Departments</option>';
  document.getElementById('secSelect').disabled=true; document.getElementById('depSelect').disabled=true;
  document.getElementById('sizeChips').innerHTML='<span class="size-chips-empty">Select filters above to see sizes</span>';
  updateBrowseBtn();
}

// ── Browse ────────────────────────────────────────────────────────────────────
async function doBrowse(){
  if(!cacheReady)return;
  const hasAny=browseDiv||browseSec||browseDep||browseBrand||selectedSizes.size>0;
  if(!hasAny)return;
  const store=document.getElementById('storeSelect').value;
  const out=document.getElementById('browseResults');
  out.innerHTML='<div class="spinner"></div>';
  const params=new URLSearchParams({store});
  if(browseDiv)params.set('div',browseDiv);
  if(browseSec)params.set('sec',browseSec);
  if(browseDep)params.set('dep',browseDep);
  if(browseBrand)params.set('brand',browseBrand);
  if(selectedSizes.size)params.set('size',[...selectedSizes].join(','));
  try{
    const res=await fetch(`/api/browse?${params}`);const data=await res.json();
    if(!res.ok){out.innerHTML=`<div class="error-msg">${data.error||'Failed.'}</div>`;return;}
    if(!data.brands||data.brands.length===0){out.innerHTML='<div class="empty">No brands found for these filters</div>';return;}
    const inStock=data.brands.filter(b=>b.inStock>0),noStock=data.brands.filter(b=>b.inStock===0);
    let html='';
    if(inStock.length){html+=`<div class="section-label">In Stock (${inStock.length} brands)</div>`;html+=inStock.map(b=>renderBrandCard(b,store)).join('');}
    if(noStock.length){html+=`<div class="section-label" style="color:#f87171">No Stock (${noStock.length} brands)</div>`;html+=noStock.map(b=>renderBrandCard(b,store)).join('');}
    out.innerHTML=html;
  }catch(e){out.innerHTML=`<div class="error-msg">Network error: ${e.message}</div>`;}
}

function renderBrandCard(b,store){
  const initial=b.brand.charAt(0).toUpperCase(),outOfTotal=b.total-b.inStock;
  const safeB=b.brand.replace(/'/g,"\\'"),safeDiv=(browseDiv||'').replace(/'/g,"\\'");
  const safeSec=(browseSec||'').replace(/'/g,"\\'"),safeDep=(browseDep||'').replace(/'/g,"\\'");
  const safeSz=[...selectedSizes].join(',').replace(/'/g,"\\'");
  return `<div class="brand-card" onclick="openBrandProducts('${safeB}','${store}','${safeDiv}','${safeSec}','${safeDep}','${safeSz}')">
    <div class="brand-logo">${initial}</div>
    <div class="brand-info"><div class="brand-name">${b.brand}</div><div class="brand-sub">${b.total} barcodes total</div></div>
    <div class="brand-count">
      <div class="count-pill${b.inStock===0?' zero':''}">${b.inStock} in stock</div>
      ${outOfTotal>0?`<div class="count-sub">${outOfTotal} out of stock</div>`:''}
    </div>
  </div>`;
}

async function openBrandProducts(brand,store,div,sec,dep,sizeStr){
  document.getElementById('brandModalTitle').textContent=brand;
  document.getElementById('brandModalBody').innerHTML='<div class="modal-loading">Loading…</div>';
  document.getElementById('brandModal').classList.add('open');
  const params=new URLSearchParams({store,brand});
  if(div)params.set('div',div);if(sec)params.set('sec',sec);if(dep)params.set('dep',dep);if(sizeStr)params.set('size',sizeStr);
  try{
    const res=await fetch(`/api/brand-products?${params}`);const data=await res.json();
    if(!res.ok||!data.products){document.getElementById('brandModalBody').innerHTML=`<div class="error-msg">${data.error||'Failed.'}</div>`;return;}
    if(data.products.length===0){document.getElementById('brandModalBody').innerHTML='<div class="modal-loading">No products found.</div>';return;}
    const inStock=data.products.filter(r=>hasStock(r)),outStock=data.products.filter(r=>!hasStock(r));
    let html='';
    if(inStock.length){html+=`<div class="section-label">In Stock (${inStock.length})</div>`;html+=inStock.map(r=>renderCard(r,store)).join('');}
    if(outStock.length){html+=`<div class="section-label" style="color:#f87171">Out of Stock (${outStock.length})</div>`;html+=outStock.map(r=>renderCard(r,store)).join('');}
    document.getElementById('brandModalBody').innerHTML=html;
  }catch(e){document.getElementById('brandModalBody').innerHTML=`<div class="error-msg">Error: ${e.message}</div>`;}
}
function closeBrandModal(e){if(!e||e.target===document.getElementById('brandModal')||!e.target)document.getElementById('brandModal').classList.remove('open');}

// ── Search ────────────────────────────────────────────────────────────────────
function hasStock(r){return(parseInt(r.storeStock)||0)>0||(parseInt(r.warehouseStock)||0)>0;}
async function doSearch(){
  if(!cacheReady)return;
  const q=document.getElementById('queryInput').value.trim(),store=document.getElementById('storeSelect').value;
  if(!q)return;
  const out=document.getElementById('searchResults');out.innerHTML='<div class="spinner"></div>';
  const params=new URLSearchParams({q,store});if(selectedBrand)params.set('brand',selectedBrand);
  try{
    const res=await fetch(`/api/search?${params}`);
    let data;try{data=await res.json();}catch{out.innerHTML='<div class="error-msg">Unexpected response.</div>';return;}
    if(!res.ok){out.innerHTML=`<div class="error-msg">${data.error||'Search failed.'}</div>`;if(res.status===503){cacheReady=false;checkStatus();}return;}
    if(!data.primary||data.primary.length===0){out.innerHTML='<div class="empty">No matching items found</div>';return;}
    const inStock=data.primary.filter(r=>hasStock(r)),outStock=data.primary.filter(r=>!hasStock(r));
    let html='';
    if(inStock.length){html+=`<div class="section-label">In Stock (${inStock.length})</div>`;html+=inStock.map(r=>renderCard(r,store)).join('');}
    if(outStock.length){html+=`<div class="section-label" style="color:#f87171">Out of Stock (${outStock.length})</div>`;html+=outStock.map(r=>renderCard(r,store)).join('');}
    out.innerHTML=html;
  }catch(e){out.innerHTML=`<div class="error-msg">Network error: ${e.message}</div>`;}
}

function renderCard(r,store){
  const name=r.itemName||r.vendorArticleName||r.barcode||'—';
  const f=parseInt(r.storeStock)||0,w=parseInt(r.warehouseStock)||0,stockout=f===0&&w===0;
  const styleBtn=r.styleId?`<button class="style-btn" onclick="event.stopPropagation();openStyleModal('${r.styleId.replace(/'/g,"\\'")}','${store}')">🔗 Style</button>`:'';
  return `<div class="card${stockout?' stockout':''}">
    <div class="card-top"><div class="item-name">${name}</div><span class="store-tag">${r.store}</span></div>
    <div class="card-meta">
      ${r.barcode?`<span>📦 ${r.barcode}</span>`:''}${r.brand?`<span>🏷 ${r.brand}</span>`:''}
      ${r.size?`<span>📐 ${r.size}</span>`:''}${r.mrp?`<span>₹ ${r.mrp}</span>`:''}
      ${r.styleId?`<span>🆔 ${r.styleId}</span>`:''}${r.expiryDate?`<span>⏳ ${r.expiryDate}</span>`:''}
    </div>
    <div class="stock-row">
      <span class="badge ${f>0?'green':'red'}">Floor: ${f}</span>
      <span class="badge ${w>0?'green':'red'}">WH: ${w}</span>
      ${styleBtn}
    </div></div>`;
}

// ── Style modal ───────────────────────────────────────────────────────────────
async function openStyleModal(styleId,store){
  document.getElementById('styleModalTitle').textContent=`Style: ${styleId}`;
  document.getElementById('styleModalBody').innerHTML='<div class="modal-loading">Loading…</div>';
  document.getElementById('styleModal').classList.add('open');
  try{
    const res=await fetch(`/api/style?styleId=${encodeURIComponent(styleId)}&store=${store}`);const data=await res.json();
    if(!res.ok||!data.items){document.getElementById('styleModalBody').innerHTML=`<div class="error-msg">${data.error||'Failed.'}</div>`;return;}
    if(data.items.length===0){document.getElementById('styleModalBody').innerHTML='<div class="modal-loading">No items found.</div>';return;}
    document.getElementById('styleModalBody').innerHTML=data.items.map(r=>{
      const name=r.itemName||r.vendorArticleName||r.barcode||'—';
      const f=parseInt(r.storeStock)||0,w=parseInt(r.warehouseStock)||0;
      return `<div class="card${f===0&&w===0?' stockout':''}">
        <div class="card-top"><div class="item-name">${name}</div></div>
        <div class="card-meta">${r.barcode?`<span>📦 ${r.barcode}</span>`:''} ${r.size?`<span>📐 ${r.size}</span>`:''}</div>
        <div class="stock-row"><span class="badge ${f>0?'green':'red'}">Floor: ${f}</span><span class="badge ${w>0?'green':'red'}">WH: ${w}</span></div>
      </div>`;
    }).join('');
  }catch(e){document.getElementById('styleModalBody').innerHTML=`<div class="error-msg">Error: ${e.message}</div>`;}
}
function closeStyleModal(e){if(!e||e.target===document.getElementById('styleModal')||!e.target)document.getElementById('styleModal').classList.remove('open');}

// ── Scanner ───────────────────────────────────────────────────────────────────
async function openScanner(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('Camera not supported.');return;}
  document.getElementById('scannerOverlay').classList.add('open');scannerActive=true;
  try{
    const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E]);
    scannerReader=new ZXing.BrowserMultiFormatReader(hints);
    const videoEl=document.getElementById('scannerVideo');
    let deviceId;
    try{const devs=await navigator.mediaDevices.enumerateDevices();const vids=devs.filter(d=>d.kind==='videoinput');const back=vids.find(d=>/back|rear|environment/i.test(d.label));deviceId=back?back.deviceId:vids[vids.length-1]?.deviceId;}catch{}
    if(deviceId){await scannerReader.decodeFromVideoDevice(deviceId,videoEl,(result)=>{if(result&&scannerActive)onBarcodeScanned(result.getText());});}
    else{await scannerReader.decodeFromConstraints({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}},videoEl,(result)=>{if(result&&scannerActive)onBarcodeScanned(result.getText());});}
  }catch(err){closeScanner();if(err.name==='NotAllowedError')alert('Camera access denied.');else alert('Could not start camera: '+err.message);}
}
function onBarcodeScanned(code){
  if(!scannerActive)return;
  const flash=document.getElementById('scanResultFlash');flash.textContent='✓ '+code;flash.classList.add('show');
  if(navigator.vibrate)navigator.vibrate(80);
  setTimeout(()=>{closeScanner();document.getElementById('queryInput').value=code;if(cacheReady)doSearch();},700);
}
function closeScanner(){
  scannerActive=false;if(scannerReader){try{scannerReader.reset();}catch{}scannerReader=null;}
  document.getElementById('scannerOverlay').classList.remove('open');document.getElementById('scanResultFlash').classList.remove('show');
}

checkStatus();
</script>
